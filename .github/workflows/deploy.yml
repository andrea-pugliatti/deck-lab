name: Deploy to GCP & Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
      REPO_NAME: deck-lab
      PAGES_PROJECT_NAME: deck-lab
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }} ./backend
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: backend-service
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          env_vars: |
            POSTGRES_USER=${{ secrets.DB_USER }}
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            APP_IMAGE_BASE_URL=https://images.decklab.games
            COOKIE_SAME_SITE=Lax
            JAVA_OPTS=-XX:TieredStopAtLevel=1 -Xmx512m -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile=application.jsa
            APP_SEED_CARDS=true
            APP_SEED_DOWNLOAD_IMAGES=false
            APP_SEED_USERS=false
          secrets: |
            POSTGRES_PASSWORD=DECK_LAB_DB_PASSWORD:latest
            GEMINI_API_KEY=DECK_LAB_GEMINI_API_KEY:latest
            JWT_SECRET=DECK_LAB_JWT_SECRET:latest
          flags: |
            --min-instances=0
            --max-instances=2
            --cpu=2
            --memory=1Gi
            --cpu-throttling
            --update-env-vars=^;^ALLOWED_CORS_ORIGINS=${{ secrets.ALLOWED_CORS_ORIGINS }}
            --service-account=backend-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies & Build
        working-directory: ./frontend
        env:
          VITE_API_URL: "https://api.decklab.games"
          VITE_IMAGES_BASE_URL: "https://images.decklab.games"
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy Static SPA to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./frontend/dist --project-name=${{ env.PAGES_PROJECT_NAME }} --branch=main
