runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
  scripts:
    - type: tests
      code: |-
        test("Response should be 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Response should contain parsed deck and warnings list", function() {
          expect(res.body).to.be.an('object');
          expect(res.body).to.have.property('deck');
          expect(res.body).to.have.property('warnings');
          expect(res.body.deck).to.be.an('object');
          expect(res.body.warnings).to.be.an('array');
        });

