info:
  name: Import YDK Deck Unmapped Passcode
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/api/decks/import/ydk"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: text/plain
  body:
    type: text
    data: |-
      #main
      46986414
      999999999

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
  scripts:
    - type: tests
      code: |-
        test("Response should be 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Response should contain warning for unmapped passcode 999999999", function() {
          expect(res.body).to.be.an('object');
          expect(res.body.warnings).to.be.an('array');
          expect(res.body.warnings).to.have.lengthOf.at.least(1);
          expect(res.body.warnings[0]).to.include('999999999');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
